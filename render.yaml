services:
  - type: web
    name: note2test-backend
    runtime: node
    rootDir: apps/backend
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm build
    startCommand: node dist/index.js
    # Render terminates TLS at the edge — the app receives plain HTTP internally.
    # HSTS and security headers are emitted by security-headers middleware.
    envVars:
      - key: NODE_ENV
        value: production
      # Set in Render dashboard → Environment → Secret Files or Secret vars.
      # Never commit actual values to this file.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: FRONTEND_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: STORAGE_PROVIDER
        sync: false
      - key: B2_ENDPOINT
        sync: false
      - key: B2_REGION
        sync: false
      - key: B2_BUCKET_NAME
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
